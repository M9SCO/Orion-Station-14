name: REUSE Headers Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check_headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install reuse

      - name: Check REUSE headers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          FILES=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- '*.cs' '*.yml' '*.yaml')
          [ -z "$FILES" ] && exit 0
          FAILED=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            reuse lint-file "$f" || FAILED=1
          done <<< "$FILES"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Files above are missing SPDX headers. Add them and push again."
            exit 1
          fi
