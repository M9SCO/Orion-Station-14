# Siberia underwear vending machine (НижнеМат)

- type: entity
  parent: VendingMachine
  id: VendingMachineUnder
  name: UnderMat
  suffix: Siberia
  description: Press the button - get the result...
  components:
  - type: VendingMachine
    pack: UnderMateInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
  - type: Advertise
    pack: ClothesMateAds
  - type: Speech
  - type: VendingMachinePricing
    defaultPrice: 40
  - type: Sprite
    sprite: _Siberia/Structures/Machines/VendingMachines/under.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.8
    energy: 1.6
    color: "#3db83b"
