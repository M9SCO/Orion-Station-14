- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterCoatMantis
  name: бурятская курта
  description: Прямиком от туда!
  components:
  - type: Sprite
    sprite: _Siberia/Clothing/OuterClothing/Coats/mantis_jacket.rsi
  - type: Clothing
    sprite: _Siberia/Clothing/OuterClothing/Coats/mantis_jacket.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
  - type: TemperatureProtection
    heatingCoefficient: 0.3
    coolingCoefficient: 0.3

