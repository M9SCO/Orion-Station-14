     baseWalkSpeed : 3.0
     baseSprintSpeed : 2.0
   - type: MeleeWeapon
     hidden: true
     damage:
      types:
        Blunt: 60
        Structural: 60
   - type: DamageStateVisuals
     rotate: true
     states:
