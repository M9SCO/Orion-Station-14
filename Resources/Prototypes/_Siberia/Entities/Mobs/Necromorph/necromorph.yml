       Critical:
         Base: brute_dead
       Dead:
         Base: brute_dead
   - type: GhostRole
     prob: 0.10
     allowMovement: true
     allowSpeech: true
     makeSentient: true
     name: некроморф
     description: Вы некроморф. Убивайте всех, чтобы трупы восстали из мертвых. Добивать раненных запрещено.
     rules: Антагонист. Добивать раненных запрещено.
   - type: SlowOnDamage
     speedModifierThresholds:
       1000: 0.7
   - type: Fixtures
     fixtures:
       fix1:
         shape:
           !type:PhysShapeCircle
           radius: 0.48
         density: 1000
         mask:
         - MobMask
         layer:
         - MobLayer

