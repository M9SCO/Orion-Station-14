# # Hacky for the stress test so don't even consider adding to this
 - type: entity
   name: неизвестное существо
   id: necromorph
   parent: SimpleSpaceMobBase
   description: раньше было разумным существом
   components:
   - type: Insulated
   - type: CombatMode
   - type: InputMover
   - type: MobMover
   - type: HTN
     rootTask:
       task: XenoCompound
     blackboard:
       NavClimb: !type:Bool
         false     
       NavInteract: !type:Bool
         true
       NavPry: !type:Bool
         true
       NavSmash: !type:Bool
         true
   - type: Tool
     speed: 1.5
     qualities:
       - Prying
     useSound:
       path: /Audio/Items/crowbar.ogg
   - type: Reactive
     groups:
       Flammable: [Touch]
       Extinguish: [Touch]
   - type: NpcFactionMember
     factions:
     - Xeno
   - type: Hands
   - type: Sprite
     drawdepth: Mobs
     sprite: _Siberia/Mobs/necromorph/necromorph.rsi
     layers:
     - map: ["enum.DamageStateVisualLayers.Base"]
       state: brutef_chest
   - type: Physics
     bodyType: Dynamic
   - type: Fixtures
     fixtures:
       fix1:
         shape:
           !type:PhysShapeCircle
           radius: 0.25
         density: 1000
         mask:
         - MobMask
         layer:
         - MobLayer
   - type: MobState
     allowedStates:
     - Alive
     - Dead
   - type: MobThresholds
     thresholds:
       0: Alive
       250: Dead
   - type: Stamina
     critThreshold: 250
   - type: Bloodstream
     bloodReagent: Blood
     bloodMaxVolume: 450     
   - type: MeleeWeapon
     altDisarm: false   
     hidden: true
     angle: 0
     soundHit:
      collection: AlienClaw
     animation: WeaponArcBite
     damage:
       groups:
         Brute: 10
   - type: Appearance
   - type: DamageStateVisuals
     rotate: true
     states:
       Alive:
         Base: brutef_chest
       Critical:
         Base: brutef_chest_lying
       Dead:
         Base: brutef_chest_lying
   - type: Puller
   - type: Butcherable
     butcheringType: Spike
     spawned:
     - id: FoodMeat
       amount: 5
   - type: GhostRole
     prob: 0.70
     allowMovement: true
     allowSpeech: true
     makeSentient: true
     name: некроморф
     description: Вы некроморф. Убивайте всех, чтобы трупы восстали из мертвых. Добивать раненных запрещено.
     rules: Антагонист. Добивать раненных запрещено.
   - type: Muted
   - type: GhostTakeoverAvailable
   - type: TypingIndicator
     proto: alien
   - type: Temperature
     heatDamageThreshold: 360
     coldDamageThreshold: -150
     currentTemperature: 310.15
   - type: Tag
     tags:
       - CannotSuicide
       - DoorBumpOpener
       - FootstepSound
   - type: NoSlip
   - type: Perishable #Ummmm the acid kills a lot of the bacteria or something
     molsPerSecondPerUnitMass: 0.0005
   - type: Speech
     speechVerb: LargeMob     

