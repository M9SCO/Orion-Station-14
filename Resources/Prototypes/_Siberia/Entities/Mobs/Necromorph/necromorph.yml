 - type: entity
   id: NecroMarker
   name: обелиск
   description: странное чувство вызывает у меня эта штука... я хочу быть единым...
   placement:
     mode: SnapgridCenter
     snap:
       - Wall
   components:
    - type: AmbientSound
      volume: 0
      range: 8
      sound:
        path: /Audio/Ambience/Objects/gravity_gen_hum.ogg
    - type: RangedDamageSound
      soundGroups:
        Brute:
          collection:
            MeatBulletImpact
      soundTypes:
        Heat:
          collection:
            MeatLaserImpact
    - type: Timer
    - type: TimedSpawner
      prototypes:
        - necromorph
        - necromorph
        - necromorph
        - necromorphRunner
        - necromorphRunner
        - necromorphRunner
        - necromorphbruteflesh
      chance: 0.80
      intervalSeconds: 60
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 2
   # - type: TimedSpawner
     # prototypes:
     # - MobXeno
     # chance: 0.85
     # intervalSeconds: 30
     # minimumEntitiesSpawned: 1
     # maximumEntitiesSpawned: 4
    - type: Clickable
    - type: InteractionOutline
    - type: Sprite
      netsync: false
      sprite: _Siberia/Structures/Objects/necromarker.rsi
      layers:
        - state: on
        # - state: wardingtower-unshaded
          # shader: unshaded
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: Transform
      anchored: false
      noRot: true
    - type: Physics
      bodyType: Static
    - type: Anchorable
    - type: Pullable
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-1.5,0.5,1.5"
          density: 1000
          mask:
          - LargeMobMask
          layer:
          - WallLayer
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 50000
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: PointLight
      radius: 4
      energy: 2
      castShadows: false
      color: "#A30707FF"
    - type: StaticPrice
      price: 500000
      
 - type: entity
   parent: NecroMarker
   id: NecroMarkerCreated
   name: рукотворный обелиск
   description: странное чувство вызывает у меня эта штука... я хочу быть единым...
   suffix: "слабые мобы"
   components:
    - type: AmbientSound
      volume: 0
      range: 8
      sound:
        path: /Audio/Ambience/Objects/gravity_gen_hum.ogg
    - type: TimedSpawner
      prototypes:
        - necromorph
        - necromorphRunner
      chance: 0.80
      intervalSeconds: 60
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 2
    - type: Sprite
      netsync: false
      sprite: _Siberia/Structures/Objects/necromarker.rsi
      scale: 0.6, 0.6
      layers:
        - state: created
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 5000
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]  
              
